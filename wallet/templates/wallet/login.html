{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Sign In — Class Wallet</title>
  <link rel="stylesheet" href="{% static 'wallet/css/app.css' %}?v=12">
  <link rel="stylesheet" href="{% static 'wallet/css/login.css' %}?v=7">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">TEACHER ACCESS</p>
    <h1>Class Wallet</h1>
    <p class="login-intro">Sign in to manage students and coin balances.</p>

    {% if form.errors %}
      <p class="login-error" role="alert">Invalid username or password.</p>
    {% endif %}

    <form method="post" class="login-form">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input id="id_username" name="username" type="text" autocomplete="username" autofocus required>
      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button class="button primary full" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
